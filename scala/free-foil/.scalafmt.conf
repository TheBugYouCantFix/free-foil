version = "3.8.1"
runner.dialect = scala3

maxColumn = 120

# 2-space indentation
indent.main = 2
indent.callSite = 2
indent.defnSite = 2

# Use colon syntax (colon after the parameter list) for methods with
# no side effects, and always align colon position.
newlines.source = keep
align.preset = some

# Imports: Scala 3 wildcard style
rewrite.rules = [
  RedundantBraces,
  RedundantParens,
  SortImports,
  PreferCurlyFors
]

# Keep 2-space indentation even for multi-line signatures
indent.withSiteRelativeToExtends = 2

project.excludeFilters = [
  target
  .bsp
  project
  .metals
]

# Standard style tweaks
docstrings.style = Asterisk
danglingParentheses.preset = true
newlines.beforeMultilineDef = false
includeCurlyBraceInSelectChains = true
trailingCommas = never